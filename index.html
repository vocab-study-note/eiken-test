<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#007b6b"><meta name="apple-mobile-web-app-title" content="英検1級テスト"><title>英検1級 パス単テスト</title>
<link rel="stylesheet" href="./style.css">
<header><div class="tag">VOCABULARY PRACTICE</div><h1>英検1級 パス単テスト生成</h1><small>範囲を選んで、今日の20問。問題用紙と解答をまとめて作成できます。</small></header>
<main><section class="panel"><form id="form" class="controls"><label>出題対象<select id="mode"><option value="all">通常のテスト</option><option value="weak">苦手単語のみ（全範囲）</option></select></label><label>100語ごとの範囲<select id="range"></select></label><label>開始番号<input id="start" type="number" min="1" max="2400" value="1" required></label><label>終了番号<input id="end" type="number" min="1" max="2400" value="100" required></label><label>問題数<input id="count" type="number" min="1" max="100" value="20" required></label><label>出題順<select id="order"><option value="random">ランダム</option><option value="number">番号順</option></select></label><button class="primary">テストを生成</button></form><div class="row"><label style="flex-direction:row;align-items:center"><input type="checkbox" id="exclude">OCR要確認を除外</label><span class="muted">2,400項目 登録済み</span></div><div class="tools"><button data-print="question-only">問題を印刷 / PDF</button><button data-print="answer-only">解答を印刷 / PDF</button><button data-print="both">両方を印刷 / PDF</button><button id="toggle">解答を隠す</button></div><p id="weak-count" class="status" aria-live="polite"></p><details><summary>保存した苦手単語を見る</summary><div id="weak-list"></div></details><p id="weak-save" aria-live="polite"></p><p id="status" class="status" aria-live="polite"></p><p id="error" role="alert"></p></section>
<div class="papers"><div id="question-wrap"><p class="caption">問題用紙</p><article class="paper" id="questions"></article></div><div id="answer-wrap"><p class="caption">解答用紙</p><article class="paper" id="answers"></article></div></div>
<details class="panel"><summary>単語データ管理 ・ 日本語訳 / OCR確認</summary><p class="muted">日本語訳は未登録です。入力した訳・確認状態はこのブラウザーに保存されます。別の端末へ移す場合はバックアップを保存してください。OCR要確認リストは未提供のため、初期状態はすべて「未判定」です。</p><div class="row"><label>表示範囲<select id="manage-range"></select></label><button id="backup">バックアップ保存</button><label>バックアップ読込<input type="file" id="restore" accept="application/json,.json"></label></div><div id="manager" class="manage-scroll"></div><p id="save-status" aria-live="polite"></p></details>
<p class="footer no-print">元CSVの綴りを保持しています。264番・964番の vent は共通の単語として扱い、同じテスト内では重複出題しません。</p></main>
<script type="module" src="./app.js"></script></html>
